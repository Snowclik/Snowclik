<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 125" width="1000" height="125" role="img" aria-label="Snowclik — Pie de página">
  <defs>
    <clipPath id="ftr-clip">
      <rect x="0.5" y="0.5" width="999" height="124" rx="16"/>
    </clipPath>
    <radialGradient id="ftr-scrim" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#060913" stop-opacity="0.66"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0.28"/>
    </radialGradient>
    <linearGradient id="ftr-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.48"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.48"/>
    </linearGradient>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.85; }
      }
      .twinkle { animation: twinkle 4.5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .twinkle { animation: none; opacity: 0.5; }
      }
    </style>
  </defs>

  <g clip-path="url(#ftr-clip)">
    <image href="data:image/jpeg;base64," x="0" y="0" width="1000" height="125" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="1000" height="125" fill="url(#ftr-scrim)"/>
    <circle class="twinkle" cx="112" cy="34" r="1.3" fill="#E0F2FE" style="animation-duration:4.4s;animation-delay:0.2s"/>
    <circle class="twinkle" cx="218" cy="86" r="1.5" fill="#E0F2FE" style="animation-duration:5.2s;animation-delay:1.1s"/>
    <circle class="twinkle" cx="326" cy="28" r="1.2" fill="#E0F2FE" style="animation-duration:4.8s;animation-delay:0.6s"/>
    <circle class="twinkle" cx="412" cy="96" r="1.4" fill="#E0F2FE" style="animation-duration:5.8s;animation-delay:1.7s"/>
    <circle class="twinkle" cx="610" cy="92" r="1.3" fill="#E0F2FE" style="animation-duration:4.6s;animation-delay:0.4s"/>
    <circle class="twinkle" cx="718" cy="30" r="1.6" fill="#E0F2FE" style="animation-duration:5.4s;animation-delay:1.4s"/>
    <circle class="twinkle" cx="812" cy="82" r="1.2" fill="#E0F2FE" style="animation-duration:4.9s;animation-delay:0.8s"/>
    <circle class="twinkle" cx="904" cy="38" r="1.5" fill="#E0F2FE" style="animation-duration:5.6s;animation-delay:2.1s"/>
  </g>

  <rect x="0.5" y="0.5" width="999" height="124" rx="16" fill="none" stroke="url(#ftr-border)" stroke-width="1"/>

  <text x="500" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="6" fill="#F8FAFC">SNOWCLIK</text>
  <text x="500" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.6" fill="#CBD5E1">Código claro · Software nativo · Visión por computador</text>
</svg>
